appId: dev.murmur.app
productName: Redflow
copyright: Copyright © 2026 Murmur contributors

directories:
  output: dist

# Only the compiled bundles and production dependencies (uiohook-napi) belong
# in app.asar. Whisper, models, and icons are shipped beside it via
# extraResources so `process.resourcesPath` matches the dev layout.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# Native modules cannot be loaded from inside an asar archive. uiohook-napi
# resolves its prebuilt .node file relative to the package directory, so the
# whole package is unpacked rather than just the binary.
asarUnpack:
  - node_modules/uiohook-napi/**/*

# Installed layout: <install>\resources\{whisper,models,icons}. This matches
# `getResourcePath(...)` in src/main/app/paths.ts, which uses process.resourcesPath
# when packaged and <repo>\resources during `npm run dev`.
extraResources:
  - from: resources/whisper
    to: whisper
    filter:
      - whisper-cli.exe
      - '*.dll'
  - from: resources/models
    to: models
    filter:
      - '*.bin'
  - from: resources/icons
    to: icons
    filter:
      - '*.ico'
      - '*.png'

# uiohook-napi ships N-API prebuilds for win32-x64; they are ABI-stable across
# Electron versions, so a local node-gyp rebuild (and a Visual Studio install)
# is unnecessary.
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  # The supplied .ico is below electron-builder's 256 px minimum, so the
  # high-resolution owner logo is converted for the executable icon instead.
  icon: resources/icons/RedFlow-logo.png
  artifactName: Redflow-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Redflow
  uninstallDisplayName: Redflow ${version}
  installerIcon: resources/icons/RedFlow-logo.ico
  uninstallerIcon: resources/icons/RedFlow-logo.ico
  installerHeaderIcon: resources/icons/RedFlow-logo.ico
  # Keep %APPDATA%\Murmur (settings.json + logs) when the app is uninstalled.
  # Reinstalling or upgrading then leaves the user's configuration intact.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
