<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:*"
    />
    <!-- The localhost WebSocket source is only used by Vite's dev HMR server. -->
    <title>Murmur Overlay</title>
  </head>
  <body>
    <div id="overlay" class="overlay" data-state="idle">
      <div class="pill" role="status" aria-live="polite">
        <span class="indicator" aria-hidden="true">
          <span class="dot"></span>
          <span class="spinner"></span>
          <span class="check">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              focusable="false"
            >
              <path d="m5 12 5 5L20 7" />
            </svg>
          </span>
          <span class="info">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              focusable="false"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5" />
              <path d="M12 8h.01" />
            </svg>
          </span>
          <span class="alert">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              focusable="false"
            >
              <path
                d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"
              />
              <path d="M12 9v4" />
              <path d="M12 17h.01" />
            </svg>
          </span>
        </span>
        <span class="text">
          <span id="overlay-label" class="label"></span>
          <span id="overlay-detail" class="detail"></span>
        </span>
        <span id="overlay-meter" class="meter" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/overlay/main.ts"></script>
  </body>
</html>
